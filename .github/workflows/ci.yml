name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A Gitea or Forgejo runner reads .github/workflows too; these jobs run on GitHub only.
jobs:
  lint:
    name: Lint and test
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # The add-on runs on the base image's python3, 3.12.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install
        run: >-
          python -m pip install --quiet "ruff==0.15.21" "yamllint==1.35.1"
          "shellcheck-py==0.10.0.1" "pytest==8.3.4"
      - name: ruff
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: yamllint
        run: >-
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 260}, comments: {min-spaces-from-content: 1}}}"
          repository.yaml agent_memory/config.yaml agent_memory/translations/en.yaml
          .github/workflows/ci.yml .gitea/workflows/validate.yml .gitea/workflows/image.yml
      - name: shellcheck
        run: shellcheck agent_memory/run.sh tests/run_image.sh
      - name: hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: agent_memory/Dockerfile
          failure-threshold: info
      - name: Tests
        run: python -m pytest -q -p no:cacheprovider tests
      - name: App linter
        uses: frenck/action-app-linter@b9cfd1bc62ba60d2c4fc96317b5f7ada5923f4a7 # v2.21.1
        with:
          path: ./agent_memory

  build:
    name: Build and run ${{ matrix.arch }}
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      # The arguments the Supervisor passes; the multi-architecture base follows the platform.
      - name: Build
        run: >-
          docker buildx build --load --platform ${{ matrix.platform }}
          --build-arg BUILD_ARCH=${{ matrix.arch }} --build-arg BUILD_VERSION=ci
          -t agent-memory:${{ matrix.arch }} agent_memory
      - name: Architecture
        run: >-
          docker image inspect --format '{{.Architecture}}' agent-memory:${{ matrix.arch }}
          | grep -qxF "$(basename ${{ matrix.platform }})"
      # A fresh install with the default options: generated tokens, MCP and REST with them, a restart.
      - name: Run
        run: bash tests/run_image.sh agent-memory:${{ matrix.arch }} ${{ matrix.platform }}
