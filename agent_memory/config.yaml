name: Agent Memory
version: "0.20.0"
slug: agent_memory
description: Shared, bounded memory for coding agents over MCP; SQLite and FTS5, no paid model in the path
url: https://github.com/heidrickla/ha-agent-memory
arch:
  - amd64
  - aarch64
startup: services
init: false
ports:
  8765/tcp: 8765
ports_description:
  8765/tcp: MCP and REST for agents on the LAN
ingress: true
homeassistant_api: true
ingress_port: 8765
panel_icon: mdi:brain
panel_title: Memory
# A client listed by name alone gets a token the add-on generates at start and logs once.
# Every other option is optional; its default is in the code and in translations/en.yaml.
options:
  clients:
    - name: claude-code
      scopes:
        - read
        - write
        - delete
    - name: codex
      scopes:
        - read
        - write
        - delete
  project_links: []
  namespace_renames: []
schema:
  clients:
    - name: str
      ip: str?
      token_sha256: str?
      scopes:
        - list(read|write|delete|export|admin)
  github_owner: str?
  forge_owner: str?
  forge_hosts:
    - str?
  project_links:
    - project: str
      namespaces:
        - str
  hubs:
    - str?
  namespace_renames:
    - from: match(^(github|gitea)/[\w.-]+/$)
      to: match(^(github|gitea)/[\w.-]+/$)
  anchor_sweep_hours: int(1,168)?
  review_at: match(^(off|([01][0-9]|2[0-3]):[0-5][0-9])$)?
  summary_candidates: bool?
  candidate_expiry_days: int(0,365)?
  context_budget_tokens: int(500,8000)?
  hard_context_limit_tokens: int(1000,16000)?
  retention_deleted_days: int(1,365)?
  ollama_url: url?
  ollama_fallback_url: url?
  ollama_direct_urls:
    - url?
  ollama_model: str?
  ollama_models:
    - str?
  ollama_timeout_s: int(10,900)?
  embed_url: url?
  embed_model: str?
  embed_timeout_s: float(0.2,30)?
