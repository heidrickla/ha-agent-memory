configuration:
  clients:
    name: Clients
    description: Who may call. A client with token_sha256 authenticates by bearer token and is recorded as the writer of what it stores; one with ip only, by source address. Scopes are read, write, delete, export, admin.
  github_owner:
    name: GitHub owner
    description: Remotes under this GitHub owner become github/<owner>/<repo> namespaces.
  forge_owner:
    name: Forge owner
    description: Remotes under this owner on the forge hosts become gitea/<owner>/<repo> namespaces.
  forge_hosts:
    name: Forge hosts
    description: Host names and addresses of the personal forge.
  project_links:
    name: Project links
    description: Repository namespaces that share a projects/<name> scope.
  anchor_sweep_hours:
    name: Anchor sweep interval (hours)
    description: How often entity anchors are checked against Home Assistant. A record whose entity is gone gets one contradicting observation, and one corroborating when it returns.
  review_at:
    name: Candidate review time
    description: Local time (HH:MM) of the nightly review, in which the enrichment model forgets candidates that repeat a record their namespace already reaches or report only what one session did. Everything else waits for an agent. Absent means 03:00; off turns it off.
  candidate_expiry_days:
    name: Extracted candidate expiry
    description: Days an extracted candidate may wait for an agent's review. The nightly review forgets one still pending after that, recoverable until retention_deleted_days. Candidates an agent stored never expire. 0 turns it off.
  summary_candidates:
    name: Keep session summaries as candidates
    description: Store each session's closing summary as a candidate for review. Off, a close queues extraction from the session's notes, which hold the summary, and keeps no summary record.
  hubs:
    name: Hubs
    description: Repository namespaces whose search and project_context also cover every other repository namespace, ranked below their own scopes. Bootstrap is unchanged.
  context_budget_tokens:
    name: Context budget
    description: Default size of a project context packet, in approximate tokens.
  hard_context_limit_tokens:
    name: Hard context limit
    description: No packet exceeds this.
  retention_deleted_days:
    name: Retention of forgotten records
    description: Soft-deleted records are purged after this many days.
  ollama_url:
    name: Model server URL
    description: Optional. Ollama (http://host:11434) or an OpenAI-style server when the URL ends in /v1 (http://host:8080/v1). With it set, session_close with notes queues extraction and the worker stores candidates.
  ollama_fallback_url:
    name: Fallback model server URL
    description: A second server with the same models. Each call goes to whichever of the two answered its last health probe and has the fewest calls in flight, ollama_url first on a tie.
  ollama_direct_urls:
    name: Direct model server URLs
    description: The model hosts themselves, asked only while ollama_url and ollama_fallback_url have no live server (the Voice Bridge's router down). Each call goes to the live one with the fewest calls in flight.
  ollama_model:
    name: Model
    description: Default model for every job kind, and the last model tried in each chain.
  ollama_models:
    name: Models per job kind
    description: Entries "<kind>:<model>", most preferred first, kinds extract and answer, e.g. extract:qwen3.5:9b. A failed model costs the next one.
  ollama_timeout_s:
    name: Model call timeout (s)
    description: One model call's limit.
  embed_url:
    name: Encoder URL
    description: Optional. An OpenAI-style /v1 base URL serving embeddings (http://host:8080/v1). With it set, search ranks by embedding similarity whenever the encoder answers and falls back to full-text search when it does not. Absent means off.
  embed_model:
    name: Encoder model
    description: The embedding model's name on that server.
  embed_timeout_s:
    name: Query embedding timeout (s)
    description: How long a search waits for its query's vector before answering from full-text search.
