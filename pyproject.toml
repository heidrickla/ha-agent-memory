[project]
name = "ha-agent-memory"
version = "0.20.0"
description = "Home Assistant add-on: shared, bounded context for coding agents over MCP"
requires-python = ">=3.12"
license = "MIT"

# Runs under the add-on base image's Alpine python3 (3.12 on Alpine 3.21).
[tool.ruff]
target-version = "py312"
line-length = 200

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "RUF", "SIM"]
ignore = ["RUF001", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"agent_memory/page.py" = ["E501"]
"agent_memory/mcp.py" = ["E501"]
"agent_memory/store.py" = ["E501"]
